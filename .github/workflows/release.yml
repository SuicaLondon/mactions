name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  build:
    name: Package (arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Validate release tag and architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { packageVersion } from './scripts/shared/paths.ts';
          if (process.env.RELEASE_TAG !== `v${packageVersion()}`) {
            throw new Error('Release tag must match the Cargo.toml package version');
          }
          if (process.arch !== 'arm64') {
            throw new Error('Release runner architecture does not match the artifact architecture');
          }
          NODE
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Lint, build, and test
        run: npm run check:all
      - name: Build release bundle
        run: npm run package
      - name: Sign and notarize release bundle
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            # Trim accidental whitespace before validating and using each secret.
            value="${!name:-}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ -z "$value" ]]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
            masked_value="${value//%/%25}"
            masked_value="${masked_value//$'\r'/%0D}"
            masked_value="${masked_value//$'\n'/%0A}"
            echo "::add-mask::$masked_value"
            export "$name=$value"
          done

          keychain="$RUNNER_TEMP/mactions-signing.keychain-db"
          certificate="$RUNNER_TEMP/mactions-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | \
            awk -v team="$APPLE_TEAM_ID" 'index($0, "\"Developer ID Application: ") && index($0, "(" team ")\"") { print $2 }')"
          if [[ ! "$identity" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo 'Expected one valid Developer ID Application identity for APPLE_TEAM_ID' >&2
            exit 1
          fi

          bundle="$(node --experimental-strip-types --input-type=module -e \
            "import { bundlePath } from './scripts/shared/paths.ts'; console.log(bundlePath());")"
          codesign --force --sign "$identity" --keychain "$keychain" \
            --options runtime --timestamp "$bundle/mactions"
          codesign --verify --strict --verbose=2 "$bundle/mactions"
          # Keep GitHub CLI's upstream Developer ID signature intact.
          codesign --verify --strict --verbose=2 "$bundle/libexec/gh"

          xcrun notarytool store-credentials mactions-notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" >/dev/null
          submission="$RUNNER_TEMP/mactions-notarization.zip"
          result="$RUNNER_TEMP/mactions-notarization.json"
          ditto -c -k --keepParent "$bundle" "$submission"
          if ! xcrun notarytool submit "$submission" --keychain-profile mactions-notary \
            --keychain "$keychain" --wait --timeout 20m --output-format json > "$result"; then
            cat "$result"
            exit 1
          fi
          node --input-type=module - "$result" <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (result.status !== 'Accepted') {
            throw new Error(`Notarization ${result.id} ended with status ${result.status}`);
          }
          console.log(`Notarization accepted: ${result.id}`);
          NODE

          # Archive the same signed bytes that Apple accepted; bare CLIs cannot be stapled.
          archive="$bundle.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bundle")" "$(basename "$bundle")"
          (cd "$(dirname "$archive")" && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          keychain="$RUNNER_TEMP/mactions-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/mactions-signing.p12" "$RUNNER_TEMP/mactions-notarization.zip"
      - name: Check bundled executables
        run: |
          ./dist/mactions-*-macos-arm64/mactions --version
          ./dist/mactions-*-macos-arm64/libexec/gh --version
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-arm64
          path: |
            dist/mactions-*-macos-arm64.tar.gz
            dist/mactions-*-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-arm64
          path: release
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tar.gz release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            release_options=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release/*.tar.gz release/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" "${release_options[@]}"
          fi
