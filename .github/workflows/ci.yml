name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  check:
    name: Check (arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Lint, build, and test
        run: npm run check:all
      - name: Validate Homebrew source installation
        run: |
          set -euo pipefail
          validation_dir="$RUNNER_TEMP/mactions-homebrew-source"
          validation_tap="suicalondon/mactions-validation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export HOMEBREW_CACHE="$validation_dir/cache"
          export HOMEBREW_TEMP="$validation_dir/tmp"
          export HOMEBREW_XDG_CONFIG_HOME="$validation_dir/config"
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          mkdir -p "$validation_dir" "$HOMEBREW_CACHE" "$HOMEBREW_TEMP"
          cleanup() {
            HOMEBREW_NO_AUTOREMOVE=1 brew uninstall "$validation_tap/mactions" 2>/dev/null || true
            brew untap "$validation_tap" 2>/dev/null || true
            rm -rf -- "$validation_dir"
          }
          trap cleanup EXIT
          archive="$validation_dir/mactions-source.tar.gz"
          git archive --format=tar --prefix=mactions-source/ HEAD | gzip -n > "$archive"
          brew tap-new --no-git "$validation_tap"
          formula="$(brew --repository "$validation_tap")/Formula/mactions.rb"
          npm run homebrew:source -- "$archive" "file://$archive" "$formula"
          brew trust --formula "$validation_tap/mactions"
          brew style --formula "$validation_tap/mactions"
          # The runner image links OpenSSL 1.1, which conflicts with current dependencies.
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          brew install --formula --yes --build-from-source --skip-link "$validation_tap/mactions"
          brew test --force "$validation_tap/mactions"
          brew audit --strict "$validation_tap/mactions"
